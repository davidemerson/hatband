# Single source for the Xcode project. Hatband.xcodeproj, every Info.plist
# and every .entitlements file are written by `xcodegen generate` and
# gitignored. Stage 0: HatbandTests bundles spec/vectors/cards.json.
name: Hatband
options:
  bundleIdPrefix: link.hatband
  deploymentTarget: { iOS: "26.0" }
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: JKXH9239G4
    GENERATE_INFOPLIST_FILE: "NO"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 3
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    HATBAND_COMMIT: dev
packages:
  HatbandCore: { path: Packages/HatbandCore }
targets:
  Hatband:
    type: application
    platform: iOS
    sources: [Hatband, Shared]
    dependencies:
      - package: HatbandCore
      - target: HatbandWidgets
        embed: true
      - target: HatbandMessages
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: link.hatband.ios
        # xcodegen defaults every iOS target to "1,2" at target level,
        # which beats the project-level setting. Said here, it holds.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    info:
      path: Hatband/Info.plist
      properties:
        CFBundleDisplayName: Hatband
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest: { UIApplicationSupportsMultipleScenes: false }
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        NSCameraUsageDescription: Hatband uses the camera only to read a card's QR code.
        NSLocationWhenInUseUsageDescription: When you save a scanned card, Hatband notes roughly where you were. It stays on this phone.
        NSLocationDefaultAccuracyReduced: true
        NSFaceIDUsageDescription: Unlock the people you have scanned.
        NSContactsUsageDescription: Adding someone you scanned. Hatband writes only the card you are looking at, and never reads your contacts.
        LSSupportsOpeningDocumentsInPlace: false
        HatbandCommit: $(HATBAND_COMMIT)
        CFBundleURLTypes:
          - { CFBundleURLName: link.hatband.ios, CFBundleURLSchemes: [hatband], CFBundleTypeRole: Viewer }
        CFBundleDocumentTypes:
          - { CFBundleTypeName: Hatband card, LSHandlerRank: Owner, LSItemContentTypes: [link.hatband.card] }
          - { CFBundleTypeName: Hatband export, LSHandlerRank: Owner, LSItemContentTypes: [link.hatband.export] }
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: link.hatband.card
            UTTypeDescription: Hatband card
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: { public.filename-extension: [hatband], public.mime-type: [application/vnd.hatband.card] }
          - UTTypeIdentifier: link.hatband.export
            UTTypeDescription: Hatband export
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: { public.filename-extension: [hatband-export], public.mime-type: [application/vnd.hatband.export] }
    entitlements:
      path: Hatband/Hatband.entitlements
      properties:
        com.apple.security.application-groups: [group.link.hatband]
        com.apple.developer.associated-domains: ["applinks:hatband.link"]
  HatbandWidgets:
    type: app-extension
    platform: iOS
    sources: [HatbandWidgets, Shared]
    dependencies:
      - package: HatbandCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: link.hatband.ios.widgets
        TARGETED_DEVICE_FAMILY: "1"  # see the app target
        SKIP_INSTALL: "YES"
    info:
      path: HatbandWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hatband
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
    entitlements:
      path: HatbandWidgets/HatbandWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.link.hatband]
  HatbandMessages:
    # Not a plain app-extension: actool compiles a stickers icon set only for
    # the messages product type, and without it the eight device icons are
    # silently dropped and the upload is rejected.
    type: app-extension.messages
    platform: iOS
    sources: [HatbandMessages, Shared]
    dependencies:
      - package: HatbandCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: link.hatband.ios.messages
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
        TARGETED_DEVICE_FAMILY: "1"  # see the app target
        SKIP_INSTALL: "YES"
    info:
      path: HatbandMessages/Info.plist
      properties:
        CFBundleDisplayName: Hatband
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    entitlements:
      path: HatbandMessages/HatbandMessages.entitlements
      properties:
        com.apple.security.application-groups: [group.link.hatband]
  HatbandTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HatbandTests
      - { path: spec/vectors/cards.json, buildPhase: resources }
    dependencies:
      - target: Hatband
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: link.hatband.ios.tests
        TARGETED_DEVICE_FAMILY: "1"  # see the app target
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
  HatbandScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources: [HatbandScreenshots]
    dependencies:
      - target: Hatband
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: link.hatband.ios.screenshots
        TARGETED_DEVICE_FAMILY: "1"
        # Not MainActor by default, unlike the app: XCTestCase's overrides are
        # nonisolated and will not compile against it.
        TEST_TARGET_NAME: Hatband
    info:
      path: HatbandScreenshots/Info.plist

schemes:
  Hatband:
    build:
      targets: { Hatband: all, HatbandWidgets: all, HatbandMessages: all, HatbandTests: [test] }
    run: { config: Debug }
    test: { config: Debug, targets: [HatbandTests] }
  # Its own scheme so CI never runs it: these drive the app to pose for the
  # App Store and take minutes, and they assert nothing about correctness.
  HatbandScreenshots:
    build:
      targets: { Hatband: all, HatbandScreenshots: [test] }
    run: { config: Debug }
    test: { config: Debug, targets: [HatbandScreenshots] }

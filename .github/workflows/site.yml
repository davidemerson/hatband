name: site
on:
  workflow_dispatch:
  push:
    paths: ["site/**", "spec/vectors/**"]
  pull_request:
    paths: ["site/**", "spec/vectors/**"]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test site/test/*.test.mjs
      - name: every page is built from the sources
        run: node site/build.mjs && git diff --exit-code -- site/

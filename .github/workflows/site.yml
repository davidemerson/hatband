name: site
on:
  push:
    paths: ["site/**", "spec/vectors/**"]
  pull_request:
    paths: ["site/**", "spec/vectors/**"]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test site/test
      - name: index.html is built from the sources
        run: node site/build.mjs && git diff --exit-code -- site/index.html

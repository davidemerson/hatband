name: core
on:
  push:
    paths: ["Packages/**", "spec/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["Packages/**", "spec/**", ".github/workflows/core.yml"]
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -q && apt-get install -y -q zbar-tools
      - run: swift test --package-path Packages/HatbandCore
      - name: vectors are current
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/gen-vectors.sh && git diff --exit-code -- spec/vectors
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/HatbandCore
